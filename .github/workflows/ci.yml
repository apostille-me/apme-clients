name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/validate-client-layout.sh
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test C client
        run: |
          cmake -S clients/c -B build/c -DCMAKE_BUILD_TYPE=Release
          cmake --build build/c
          ctest --test-dir build/c --output-on-failure
      - name: Build and test C++ client
        run: |
          cmake -S clients/cpp -B build/cpp -DCMAKE_BUILD_TYPE=Release
          cmake --build build/cpp
          ctest --test-dir build/cpp --output-on-failure
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - name: Build and test Zig client
        run: zig build test
        working-directory: clients/zig
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs
      - run: node --check src/index.mjs
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path clients/rust/Cargo.toml --all-targets
      - run: cargo test --manifest-path clients/wasm/Cargo.toml --all-targets
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - run: go test ./...
        working-directory: clients/go
