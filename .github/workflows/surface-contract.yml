name: surface-contract

# Downstream client-surface projection. The wire/domain authorities remain the independently
# authored TypeSpec and JSON Schema contracts in apostille-me/apme-interfaces, admitted by
# ORESoftware/typespec-json-schema-validator. This gate only checks SDK export parity.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: surface-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: contract document
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      languages: ${{ steps.langs.outputs.languages }}
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Validate the contract with the bundled validator
        run: python3 contract/bin/check_surface.py --schema-only
      - name: Validate again with the reference jsonschema implementation
        run: |
          python3 -m pip install --quiet jsonschema
          python3 contract/bin/check_surface.py --schema-only
      - id: langs
        name: Enumerate enforced clients
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          c = json.load(open("contract/surface.contract.json"))
          langs = sorted(k for k, v in c["languages"].items() if v["tier"] != "off")
          print("languages=" + json.dumps(langs))
          PY

  clients:
    name: clients/${{ matrix.language }}
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.contract.outputs.languages) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Check exported surface
        run: python3 contract/bin/check_surface.py --lang "${{ matrix.language }}" --format github

  summary:
    name: full sweep
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Every client, one report
        run: python3 contract/bin/check_surface.py
