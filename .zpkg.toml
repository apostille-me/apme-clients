[package]
org = "apostille-me"
name = "apme-clients"
version = "0.1.0"
description = "Polyglot SDK clients for Apostille Me"
license = "MIT"
language = "polyglot"
keywords = ["clients", "sdk", "polyglot", "openapi"]

[package.repository]
vcs = "git"
url = "https://github.com/apostille-me/apme-clients"

[install]
dir = ".vendor/.zed"

[dependencies]
"apostille-me/apme-interfaces" = "^0.1.0"
"apostille-me/apme-libs" = "^0.1.0"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", "node_modules/**", "target/**", "dist/**", "build/**", ".build/**", "*.log", ".vendor/.zed/**"]

[scripts]
test = "bash scripts/test.sh"
validate-layout = "bash scripts/validate-client-layout.sh"
verify-matrix = "node scripts/verify-client-matrix.mjs"

[targets.repository]
dir = "."
name = "apme-clients-repository"

[targets.nodejs]
dir = "clients/typescript/nodejs"
adapter = "node"

[targets.deno]
dir = "clients/typescript/deno"

[targets.bun]
dir = "clients/typescript/bun"
adapter = "node"

[targets.edge]
dir = "clients/typescript/edge"

[targets.golang]
dir = "clients/go"
adapter = "go"

[targets.python3]
dir = "clients/python"
adapter = "python"

[targets.ruby]
dir = "clients/ruby"

[targets.php]
dir = "clients/php"

[targets.rust]
dir = "clients/rust"
adapter = "rust"

[targets.rust-wasm]
dir = "clients/wasm"
adapter = "node"

[targets.dart]
dir = "clients/dart"
adapter = "dart"

[targets.gleamlang]
dir = "clients/gleam"

[targets.erlang]
dir = "clients/erlang"

[targets.elixir]
dir = "clients/elixir"

[targets.java]
dir = "clients/java"
adapter = "java"

[targets.kotlin]
dir = "clients/kotlin"
adapter = "java"

[targets.swift]
dir = "clients/swift"
