[package]
org = "apostille-me"
name = "apme-clients"
version = "0.1.0"
description = "Polyglot SDK clients for Apostille Me"
license = "MIT"
language = "polyglot"

[package.repository]
vcs = "git"
url = "https://github.com/apostille-me/apme-clients"

[install]
dir = ".vendor/.zed"

[dependencies]
"apostille-me/apme-interfaces" = "^0.1.0"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", "node_modules/**", "target/**", "dist/**", "*.log", ".vendor/.zed/**"]

[scripts]
test = "bash scripts/test.sh"
